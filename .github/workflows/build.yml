name: Build Automatically

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the project
        run: |
          bun run build 2>&1 | tee build.log
          echo '--- files ---'; find dist -maxdepth 3 | head -50

      - name: Prepare static site
        run: |
          mkdir -p site
          SRC=$(dirname "$(find dist .output -name index.html -not -path '*/node_modules/*' 2>/dev/null | head -1)")
          echo "Using $SRC"
          cp -r "$SRC"/. site/
          test -f site/index.html || (echo "index.html missing" && tail -60 build.log && exit 1)
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
